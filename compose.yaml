x-app: &app
  image: campusrent:local
  build: .
  environment: &environment
    ASPNETCORE_ENVIRONMENT: Production
    Database__Provider: Postgres
    ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=campusrent;Username=campusrent;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
    Jwt__Issuer: CampusRent
    Jwt__Audience: CampusRentApp
    ClientUrl: ${CLIENT_URL:-http://localhost:8080}
    Admin__Email: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
    Admin__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
    Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:-}
    Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: campusrent
      POSTGRES_USER: campusrent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusrent -d campusrent"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    command: ["--migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  app:
    <<: *app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "dotnet", "CampusRent.Server.dll", "--healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
volumes:
  postgres_data:
