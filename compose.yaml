services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: campusrent:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Postgres
      ConnectionStrings__DefaultConnection: ${DATABASE_URL:-Host=aws-0-ap-south-1.pooler.supabase.com;Port=5432;Database=postgres;Username=postgres.auqnfzpqeabvgplkfaxa;Password=U4ipQKxlAGIxxr9d;SSL Mode=Require;Trust Server Certificate=true;}
      Jwt__Secret: ${JWT_SECRET:-CampusRent_Production_Secret_Key_2026_Secure_JWT_Token_At_Least_32_Chars}
      Jwt__Issuer: CampusRent
      Jwt__Audience: CampusRentApp
      ClientUrl: ${CLIENT_URL:-http://localhost:8080}
      Admin__Email: ${ADMIN_EMAIL:-admin@campusrent.vn}
      Admin__Password: ${ADMIN_PASSWORD:-Password@123456}
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:-}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:-}
      GooglePlaces__ApiKey: ${GOOGLE_PLACES_API_KEY:-}
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "dotnet", "CampusRent.Server.dll", "--healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  uploads_data:
