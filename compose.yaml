services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: campusrent:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: ${DATABASE_PROVIDER:-Postgres}
      ConnectionStrings__DefaultConnection: ${DATABASE_URL:-Host=db;Port=5432;Database=campusrent;Username=postgres;Password=${POSTGRES_PASSWORD:-campusrent_secret};SSL Mode=Disable;Trust Server Certificate=true;}
      Jwt__Secret: ${JWT_SECRET:-CampusRent_Production_Secret_Key_2026_Secure_JWT_Token_At_Least_32_Chars}
      Jwt__Issuer: CampusRent
      Jwt__Audience: CampusRentApp
      ClientUrl: ${CLIENT_URL:-http://localhost:8080}
      Admin__Email: ${ADMIN_EMAIL:-admin@campusrent.vn}
      Admin__Password: ${ADMIN_PASSWORD:-Password@123456}
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:-}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:-}
      GooglePlaces__ApiKey: ${GOOGLE_PLACES_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "dotnet", "CampusRent.Server.dll", "--healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: campusrent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusrent_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campusrent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  uploads_data:
  postgres_data:
