name: CampusRent CI
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: campusrent_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d campusrent_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: dotnet tool restore
      - run: dotnet test tests/CampusRent.Tests --settings tests/coverage.runsettings --collect:"XPlat Code Coverage"
        env:
          CAMPUSRENT_TEST_POSTGRES: Host=localhost;Port=5432;Database=campusrent_ci;Username=postgres;Password=ci-only-password
      - run: dotnet ef migrations has-pending-model-changes --project server --no-build
      - run: npm ci
        working-directory: client
      - run: npm audit --audit-level=moderate
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run format:check
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run test:e2e
        working-directory: client
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            client/playwright-report/
            tests/CampusRent.Tests/TestResults/
  container:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t campusrent:local .
      - name: Validate Compose and exercise production startup
        env:
          POSTGRES_PASSWORD: ci-only-database-password
          JWT_SECRET: ci-only-generated-secret-more-than-32-bytes
          ADMIN_EMAIL: admin@ci.example.com
          ADMIN_PASSWORD: ci-only-admin-password
        run: |
          docker compose config --quiet
          docker compose up app -d --no-build
          curl --retry 30 --retry-delay 2 --retry-connrefused --fail http://localhost:8080/health
          curl --fail http://localhost:8080/
          curl --fail http://localhost:8080/api/universities
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
        env:
          POSTGRES_PASSWORD: ci-only-database-password
          JWT_SECRET: ci-only-generated-secret-more-than-32-bytes
          ADMIN_EMAIL: admin@ci.example.com
          ADMIN_PASSWORD: ci-only-admin-password
