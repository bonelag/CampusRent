name: Build & Publish Docker Image
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  publish:
    name: Build & Push to GHCR
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require successful CI for manual publishing
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          result=$(gh run list --repo "$RELEASE_REPOSITORY" --workflow ci.yml --commit "$RELEASE_SHA" --status success --limit 1 --json conclusion --jq 'length')
          test "$result" -gt 0 || { echo "Run CampusRent CI successfully for this commit before publishing."; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment Instructions Summary
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Markdown fences are intentional literal backticks.
          # shellcheck disable=SC2016
          printf 'Verified image tags:\n\n```\n%s\n```\n\n' "$IMAGE_TAGS" >> "$GITHUB_STEP_SUMMARY"
          # shellcheck disable=SC2016
          printf 'Installer (prompts for PostgreSQL/admin and supports HTTPS):\n\n```sh\ncurl -fsSL https://raw.githubusercontent.com/bonelag/CampusRent/main/deploy.sh | sh\n```\n' >> "$GITHUB_STEP_SUMMARY"

